  <script>
    // Anciennes adresses du site Google (hannabony.com/research, /cv…) → onglet correspondant

    var map = { "/home": "home", "/research": "research", "/teaching": "teaching", "/cv": "cv", "/contact": "contact" };
    location.replace("/" + (map[p] ? "#" + map[p] : ""));
  </script>
</head>
